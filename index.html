
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173d39">
<title>Fukushima 2026｜只見線攝影之旅</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#20332f;background:#f5f6f2}
*{box-sizing:border-box}
body{margin:0}
.wrap{max-width:740px;margin:auto}
header{background:linear-gradient(125deg,#173d39,#356a5c);color:white;padding:28px 20px}
header small{letter-spacing:2px;opacity:.8}
h1{font-size:27px;margin:9px 0}
header p{font-size:13px;color:#dcebe4;margin:0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;top:0;background:#f5f6f2;padding:10px;z-index:10;border-bottom:1px solid #dfe8e1}
.tabs button{border:1px solid #cbd9d0;background:white;border-radius:11px;padding:10px 3px;font-size:12px;font-weight:700;color:#315d50;cursor:pointer}
.tabs button.active{background:#173d39;color:white}
main{padding:15px 14px 60px}
.intro{background:#e5eee8;padding:16px;border-radius:15px;margin-bottom:16px}
.intro h2{font-size:18px;margin:0 0 7px}
.intro p{font-size:13px;line-height:1.7;margin:0;color:#45685c}
.card{background:white;border:1px solid #e2e8e2;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #20332f09}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.time{font-size:13px;font-weight:800;color:#61776b}
.tag{font-size:11px;background:#e8f2ea;color:#326449;border-radius:20px;padding:5px 8px}
.tag.train{background:#ffeded;color:#b42323}
.name{font-size:17px;font-weight:750;margin:9px 0;line-height:1.5}
.desc{font-size:14px;color:#4b6258;line-height:1.75;margin:8px 0 13px;white-space:pre-line}
.train-time{color:#c62828;font-weight:850}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions a,.copy{display:inline-flex;align-items:center;justify-content:center;min-height:43px;padding:10px 12px;border-radius:11px;font-size:13px;font-weight:700;text-decoration:none;border:1px solid #bcd5c8;background:#f2faf5;color:#195c49}
.actions a:first-child{background:#1d6654;color:white;border-color:#1d6654}
.copy{cursor:pointer;margin-left:8px}
.code{font-size:13px;color:#526e60;margin-top:12px}
.note{font-size:12px;line-height:1.7;color:#6b7e72;margin:17px 3px}
.ref{background:white;border:1px solid #e2e8e2;border-radius:14px;padding:15px;margin:11px 0;font-size:14px;line-height:1.8;overflow-wrap:anywhere}
.ref a{color:#1d6654}
.hidden{display:none}
footer{text-align:center;color:#82948a;font-size:12px;margin-top:28px}
@media(min-width:700px){main{padding:22px}.card{padding:20px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<small>FUKUSHIMA · NOV 2026</small>
<h1>只見線攝影之旅 🍁</h1>
<p>11/13（五）– 11/14（六）｜手機攝影導航手冊</p>
</header>
<nav class="tabs">
<button class="active" data-tab="day1">11/13<br>Day 1</button>
<button data-tab="day2a">11/14<br>需補拍</button>
<button data-tab="day2b">11/14<br>不需補拍</button>
<button data-tab="notes">📖<br>參考資料</button>
</nav>
<main>
<section id="day1"></section>
<section id="day2a" class="hidden"></section>
<section id="day2b" class="hidden"></section>
<section id="notes" class="hidden"></section>
<footer>Fukushima 2026 · Personal Travel Guide</footer>
</main>
</div>
<script>
// Google Maps：座標、地點搜尋、開車路線
const loc=(x)=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(x);
const drive=(a,b)=>"https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(a)+"&destination="+encodeURIComponent(b)+"&travelmode=driving";
const M={
rest:"道の駅 尾瀬街道みしま宿",
view:"第一只見川橋梁ビューポイント",
flat:"37.489925,139.669203",
third1:"37.463000,139.617733",
third4:"37.459354,139.613583",
thirdPark:"37.461920,139.612800",
arches:"37.473279,139.648426",
hotel:"宮下温泉 栄光舘",
mist1:"37.462371,139.595143",
mist2:"37.464639,139.588639",
fourth1:"37.481640,139.560030",
fourth2:"37.481690,139.554565",
oshi:"37.457740,139.531530",
fifth:"37.448361,139.511972",
cliff:"塔のへつり 木かげの駐車場",
station:"会津若松駅"
};
// 每一筆：[時間,景點,說明,導航按鈕陣列,Mapcode]
const D1=[
["11:00–11:20","第一橋 C／D 展望台停車場","抵達道之驛、停車、準備拍攝",[[ "道之驛停車場",loc(M.rest) ]],""],
["11:20–11:50","步行至第一橋 C／D 展望台","登山、尋找最佳構圖",[[ "第一橋展望台",loc(M.view) ]],""],
["11:50–13:10","第一橋 C／D 經典俯瞰角度","13:03 火車必拍，往會津若松方向。等待時可觀察河面風況。",[[ "第一橋展望台",loc(M.view) ]],""],
["13:10–13:40","下山返回停車場","預留約 30 分鐘，不趕路。",[],""],
["13:40–14:05","開往第一橋平面角度","依風況、道路安全決定是否前往；山路小心駕駛。",[[ "開車路線",drive(M.rest,M.flat) ]],""],
["14:05–14:35","第一橋平面角度","14:23 火車挑戰拍攝，往會津川口方向；亦可拍倒影。若道路不安全直接取消。",[[ "平面拍攝點",loc(M.flat) ]],""],
["14:35–15:05","開往第三橋區域","預留約 30 分鐘，實際依導航。",[[ "前往第三橋點 1",drive(M.flat,M.third1) ]],""],
["15:05–15:25","第三橋拍攝點 1：高清水隧道／雪棚","經典俯瞰角度空景。只有確認安全步行及停車空間才拍，不在車道停留。",[[ "拍攝點 1",loc(M.third1) ]],""],
["15:25–15:50","第三橋拍攝點 4：國道 252 側","主要拍攝點，拍攝鐵橋側面。先導航停車位置，再步行至拍攝點。",[[ "先導航停車位置",loc(M.thirdPark) ],["查看拍攝位置",loc(M.third4) ]],""],
["15:50–16:15","宮下アーチ三兄弟","返回栄光舘途中順路短拍。光線不足可隔天早上從旅館步行拍攝。",[[ "三兄弟拍攝點",loc(M.arches) ]],"397 198 366"],
["16:15–16:30","宮下温泉 栄光舘 Check-in","入住、停車、休息。",[[ "栄光舘導航",loc(M.hotel) ]],""]
];
const D2A=[
["07:30–07:55","栄光舘 → 第一橋停車場","退房後出發，預留約 25 分鐘車程。",[[ "道之驛停車場",loc(M.rest) ]],"397 200 896"],
["07:55–08:25","步行至第一橋 C／D 展望台","登山、找構圖。",[[ "第一橋展望台",loc(M.view) ]],""],
["08:25–09:25","第一橋 C／D","09:01、09:20 火車補拍，兩個方向。",[[ "第一橋展望台",loc(M.view) ]],""],
["09:25–10:05","下山、開往霧幻峽","含步行、開車緩衝。",[[ "開車路線",drive(M.rest,M.mist1) ]],""],
["10:05–10:20","霧幻峽點 1：橋上","河谷風景、隨緣拍霧；確認安全步行空間。",[[ "拍攝點 1",loc(M.mist1) ]],""],
["10:20–10:45","霧幻峽點 2：河岸側","不同河谷視角，含移動及步行。座標僅為附近參考位置，確認道路安全才拍。",[[ "參考座標",loc(M.mist2) ]],""],
["10:45–11:15","前往第四橋","預留約 30 分鐘移動。",[[ "開車路線",drive(M.mist2,M.fourth1) ]],""],
["11:15–11:35","第四橋點 1：水沼橋遠眺","鐵橋、河谷全景。",[[ "水沼橋拍攝點",loc(M.fourth1) ]],"397 217 408"],
["11:35–11:55","第四橋點 2：側面倒影","鐵橋側面、河面倒影；注意站立空間。",[[ "拍攝點 2",loc(M.fourth2) ]],""],
["11:55–12:15","前往大志集落","目標 12:15 前抵達並完成構圖。",[[ "開車路線",drive(M.fourth2,M.oshi) ]],""],
["12:15–12:40","大志集落點 1","約 12:31 火車必拍！往會津若松方向。",[[ "大志集落拍攝點",loc(M.oshi) ]],""],
["12:40–12:50","簡單午餐／休息","建議自備飯糰或三明治，不安排餐廳等候。",[[ "大志集落附近",loc(M.oshi) ]],""],
["12:50–14:50","大志集落 → 塔崖","以 14:30–15:00 抵達為目標，實際依導航；不為趕時間超速。",[[ "開車路線",drive(M.oshi,M.cliff) ]],""],
["14:50–15:35","塔崖（塔のへつり）","奇岩、吊橋、河谷；爭取日落前較好的自然光。",[[ "木かげ停車場",loc(M.cliff) ]],"433 378 503*37"],
["15:35–16:45","塔崖 → 會津若松站","預留約 70 分鐘車程。",[[ "開車路線",drive(M.cliff,M.station) ]],""],
["16:45–17:15","加油、還車","預留約 30 分鐘緩衝。",[[ "會津若松站租車據點",loc("会津若松駅 レンタカー") ]],""]
];
const D2B=[
["08:00–08:25","栄光舘 → 霧幻峽","早餐、退房後出發；沿途隨緣觀察晨霧。",[[ "開車路線",drive(M.hotel,M.mist1) ]],""],
["08:25–08:40","霧幻峽點 1：橋上","河谷、只見川、晨霧。",[[ "拍攝點 1",loc(M.mist1) ]],""],
["08:40–09:00","霧幻峽點 2：河岸側","不同河谷視角，含移動及步行；道路安全可達才拍。",[[ "參考座標",loc(M.mist2) ]],""],
["09:00–09:20","前往第四橋點 1","以 09:20 前抵達水沼橋為目標。",[[ "開車路線",drive(M.mist2,M.fourth1) ]],""],
["09:20–09:40","第四橋點 1：水沼橋遠眺","約 09:32 火車拍攝！下行往會津川口，兼拍鐵橋及河谷。",[[ "水沼橋拍攝點",loc(M.fourth1) ]],"397 217 408"],
["09:40–10:05","第四橋點 2：側面倒影","鐵橋側面、河面倒影；注意站立空間。",[[ "拍攝點 2",loc(M.fourth2) ]],""],
["10:05–10:40","前往大志集落","預留車程與停車緩衝。",[[ "開車路線",drive(M.fourth2,M.oshi) ]],""],
["10:40–11:45","大志集落周邊自由拍攝、休息","不增加遠距離景點；可先觀察構圖及拍河谷空景。",[[ "大志集落點 1",loc(M.oshi) ]],""],
["11:45–12:10","簡單午餐","建議自備飯糰、三明治或便當，避免餐廳等候。",[],""],
["12:10–12:40","大志集落點 1：かねやまふれあい広場","約 12:31 火車必拍！往會津若松方向，提前完成構圖。",[[ "大志集落拍攝點",loc(M.oshi) ]],""],
["12:40–13:15","第五只見川橋梁（選拍）","拍橋梁及山谷空景；若影響塔崖抵達時間就取消。",[[ "第五橋拍攝點",loc(M.fifth) ]],""],
["13:15–15:00","第五橋 → 塔崖","長距離移動，15:00 前抵達為目標；實際依導航。",[[ "開車路線",drive(M.fifth,M.cliff) ]],""],
["15:00–15:45","塔崖（塔のへつり）","奇岩、吊橋、河谷；下午山谷可能已有陰影。",[[ "木かげ停車場",loc(M.cliff) ]],"433 378 503*37"],
["15:45–16:55","塔崖 → 會津若松站","預留約 70 分鐘車程。",[[ "開車路線",drive(M.cliff,M.station) ]],""],
["16:55–17:25","加油、還車","預留 30 分鐘緩衝。",[[ "會津若松站租車據點",loc("会津若松駅 レンタカー") ]],""]
];
// 避免 HTML 注入，並將火車時刻標紅
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function red(s){
return esc(s).replace(/13:03|14:23|09:01|09:20|09:32|12:31/g,x=>'<span class="train-time">'+x+'</span>');
}
function render(id,title,subtitle,rows){
document.getElementById(id).innerHTML=
'<div class="intro"><h2>'+title+'</h2><p>'+subtitle+'</p></div>'+
rows.map(r=>{
const [time,name,desc,nav,code]=r;
const isTrain=/火車|列車/.test(desc);
return '<article class="card">'+
'<div class="top"><span class="time">'+esc(time)+'</span>'+
(isTrain?'<span class="tag train">🚆 火車重點</span>':name.includes("選拍")?'<span class="tag">彈性選拍</span>':'')+'</div>'+
'<div class="name">'+esc(name)+'</div>'+
'<div class="desc">'+red(desc)+'</div>'+
'<div class="actions">'+nav.map(n=>'<a target="_blank" rel="noopener" href="'+esc(n[1])+'">📍 '+esc(n[0])+'</a>').join('')+'</div>'+
(code?'<div class="code">Mapcode：<strong>'+esc(code)+'</strong><button class="copy" data-code="'+esc(code)+'">複製</button></div>':'')+
'</article>';
}).join('')+
'<div class="note">提醒：列車通過時間為行程參考，請以當日 JR 運行資訊為準。道路、停車、步行及光線條件須現場確認；不為拍照在車道或雪棚內冒險停留。</div>';
}
render("day1","Day 1｜11/13（五）","第一橋 13:03 → 平面角度 14:23 → 第三橋 → 宮下三兄弟 → 栄光舘",D1);
render("day2a","Day 2｜需要補拍第一橋","09:01／09:20 第一橋 → 霧幻峽 → 第四橋 → 12:31 大志集落 → 塔崖",D2A);
render("day2b","Day 2｜不需補拍第一橋","霧幻峽 → 09:32 第四橋 → 12:31 大志集落 → 第五橋（選拍）→ 塔崖",D2B);
// 我的參考資料
const references=[
["May 地圖【奧會津絕景 只見線】","https://drive.google.com/open?id=1-NABc0Q-lIcXV0Sqjjj5db4TkEUVNKoT&usp=sharing"],
["只見線拍照攻略","https://immay.tw/post-205100098/"],
["第 1–8 只見川橋梁全制霸攝影攻略","https://immay.tw/tadami-river-bridge/"],
["日本人版攝影攻略","https://t-photolocations.com/tadami2/"],
["奧會津休憩館住宿及攝影攻略","https://immay.tw/post-224814323/"],
["尾瀬街道みしま宿","https://www.michi-no-eki.jp/stations/views/19028"],
["JR 東日本時刻表","https://www.jreast-timetable.jp/"],
["會津西方站時刻表","https://www.jreast-timetable.jp/timetable/list0010.html"],
["會津檜原站時刻表","https://www.jreast-timetable.jp/timetable/list0012.html"],
["只見線列車時刻資訊","http://www.town.kaneyama.fukushima.jp/site/tadamisen/jrtadamisennhennkou2.html"]
];
const notes=[
"iPhone 攝影：第一橋 D 點可使用 HEIF 24MP 或 48MP。",
"HEIF Max 48MP：想拍整片山谷與紅葉風景，可使用 1x 主鏡頭＋HEIF Max 48MP，適合後續放大及裁切。",
"第一橋上午 9 點左右，約 30 分鐘內可拍兩班火車。建議提前 30 分鐘以上抵達休息站，預留登山及構圖時間。",
"會津若松自駕到第一橋，實際可能比 Google Maps 預估更久，應保留交通緩衝。",
"第一橋展望台附近的道の駅 尾瀬街道みしま宿設有免費停車場。",
"你已選擇入住宮下温泉 栄光舘，方便隔天視情況補拍第一橋。",
"霧幻峽河霧隨緣拍攝，不特別為了晨霧提早到清晨六點出發。",
"大志集落火車優先。拍完後若要前往塔崖，盡量在 12:40–12:50 離開。",
"第五橋為選拍。若 Google Maps 顯示抵達塔崖時間過晚，直接取消第五橋。",
"第三橋點 2、3 不安排。第三橋點 1 位於雪棚，只有安全可達才拍。"
];
document.getElementById("notes").innerHTML=
'<div class="intro"><h2>我的參考資料 📖</h2><p>攝影攻略、列車時刻與旅行注意事項。</p></div>'+
'<h3>攝影及交通參考連結</h3>'+
references.map(r=>'<div class="ref"><a target="_blank" rel="noopener" href="'+esc(r[1])+'">🔗 '+esc(r[0])+'</a></div>').join('')+
'<h3>攝影與行程筆記</h3>'+
notes.map(n=>'<div class="ref">'+esc(n)+'</div>').join('')+
'<div class="ref"><strong>📷 拍攝角度照片</strong><p>預留照片區，後續可加入各拍攝點參考照片。</p></div>';
// 頁籤切換
document.querySelectorAll("[data-tab]").forEach(b=>{
b.addEventListener("click",()=>{
document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));
document.querySelectorAll("main section").forEach(s=>s.classList.toggle("hidden",s.id!==b.dataset.tab));
window.scrollTo({top:0,behavior:"instant"});
});
});
// Mapcode 複製
document.addEventListener("click",async e=>{
const b=e.target.closest("[data-code]");
if(!b)return;
try{
await navigator.clipboard.writeText(b.dataset.code);
b.textContent="已複製 ✓";
setTimeout(()=>b.textContent="複製",1500);
}catch(err){prompt("請複製 Mapcode",b.dataset.code);}
});
</script>
</body>
</html>
