
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
  color:#432D26;background:#F8F2E9
}
*{box-sizing:border-box}
body{margin:0}
.wrap{max-width:740px;margin:auto}
header{
  background:linear-gradient(130deg,#A94E30,#C77942);
  color:white;padding:28px 20px
}
header small{letter-spacing:2px;opacity:.9}
h1{font-size:27px;margin:9px 0}
header p{font-size:13px;color:#FFE2C2;margin:0}
.tabs{
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
  position:sticky;top:0;background:#F8F2E9;
  padding:10px;z-index:10;border-bottom:1px solid #EADCCB
}
.tabs button{
  border:1px solid #E2CBB8;background:#FFFDF8;
  border-radius:11px;padding:10px 3px;font-size:12px;
  font-weight:700;color:#8B4A32;cursor:pointer
}
.tabs button.active{background:#A94E30;color:white}
main{padding:15px 14px 60px}
.intro{
  background:#F3E2D1;padding:16px;
  border-radius:15px;margin-bottom:16px
}
.intro h2{font-size:18px;margin:0 0 7px}
.intro p{font-size:13px;line-height:1.7;margin:0;color:#805641}
.card{
  position:relative;background:white;
  border:1px solid #EADCCB;border-radius:16px;
  padding:16px;margin:12px 0;
  box-shadow:0 2px 8px #432D2609
}
.card.has-photo{
  padding-right:calc(clamp(96px,30%,155px) + 23px)
}
.top{
  display:flex;justify-content:space-between;
  gap:8px;align-items:center;flex-wrap:wrap
}
.time{font-size:13px;font-weight:800;color:#9B7056}
.tag{
  font-size:11px;background:#F6E5D5;color:#9B5B36;
  border-radius:20px;padding:5px 8px
}
.tag.train{background:#FFEAEA;color:#B42323}
.tag.optional{background:#FFF2E0;color:#9B5B24}
.name{font-size:17px;font-weight:750;margin:9px 0;line-height:1.5}
.desc{
  font-size:14px;color:#67534A;line-height:1.75;
  margin:8px 0 13px;white-space:pre-line
}
.train-time{color:#C62828;font-weight:850}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions a,.copy{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:43px;padding:10px 12px;border-radius:11px;
  font-size:13px;font-weight:700;text-decoration:none;
  border:1px solid #E2C5AD;background:#FFF5EB;color:#93482E
}
.actions a:first-child{
  background:#A94E30;color:white;border-color:#A94E30
}
.copy{cursor:pointer;margin-left:8px}
.code{font-size:13px;color:#805D4A;margin-top:12px}
.note{
  font-size:12px;line-height:1.7;color:#907767;
  margin:17px 3px
}
.ref{
  background:white;border:1px solid #EADCCB;
  border-radius:14px;padding:15px;margin:11px 0;
  font-size:14px;line-height:1.8;overflow-wrap:anywhere
}
.ref a{color:#A94E30}
.hidden{display:none}
footer{text-align:center;color:#9D8877;font-size:12px;margin-top:28px}
.photo-thumb{
  position:absolute;right:9px;top:9px;bottom:9px;
  width:clamp(96px,30%,155px);border:0;padding:0;
  border-radius:11px;overflow:hidden;
  background:#F0E4D6;cursor:zoom-in
}
.photo-thumb img{
  width:100%;height:100%;object-fit:cover;display:block
}
.card.has-photo .actions a{
  font-size:12px;padding:8px;min-height:39px
}
.card.has-photo .name{font-size:16px}
.card.has-photo .desc{font-size:13px}
.nav-warning{
  margin-top:12px;padding:11px 12px;
  border-radius:10px;background:#FFF2DF;
  color:#83501C;font-size:12px;line-height:1.7
}
.nav-warning strong{color:#A44220}
.lightbox{
  position:fixed;inset:0;z-index:100;
  background:rgba(24,12,9,.95);display:none;
  align-items:center;justify-content:center;
  padding:48px 12px 28px
}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox-close{
  position:absolute;right:15px;top:12px;
  color:white;background:#6D4032;border:0;
  border-radius:50%;font-size:26px;
  width:42px;height:42px;cursor:pointer
}
@media(max-width:390px){
  .card.has-photo{padding-right:117px;padding-left:12px}
  .photo-thumb{width:100px}
  .card.has-photo .name{font-size:15px}
  .card.has-photo .actions a{font-size:11px}
}
@media(min-width:700px){
  main{padding:22px}.card{padding:20px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
<small>FUKUSHIMA · NOV 2026</small>
<h1>只見線攝影之旅 🍁</h1>
<p>11/13（五）– 11/14（六）｜手機攝影導航手冊</p>
</header>
<nav class="tabs">
<button class="active" data-tab="day1">11/13<br>Day 1</button>
<button data-tab="day2a">11/14<br>需補拍</button>
<button data-tab="day2b">11/14<br>不需補拍</button>
<button data-tab="notes">📖<br>參考資料</button>
</nav>
<main>
<section id="day1"></section>
<section id="day2a" class="hidden"></section>
<section id="day2b" class="hidden"></section>
<section id="notes" class="hidden"></section>

</main>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-label="照片放大檢視">
<button class="lightbox-close" aria-label="關閉照片">×</button>
<img id="lightbox-image" alt="放大的攝影參考照片">
</div>

<script>
const loc=x=>
"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(x);

const drive=(a,b)=>
"https://www.google.com/maps/dir/?api=1&origin="+
encodeURIComponent(a)+"&destination="+
encodeURIComponent(b)+"&travelmode=driving";

const M={
rest:"道の駅 尾瀬街道みしま宿",
view:"第一只見川橋梁ビューポイント",
flat:"37.489925,139.669203",
third1:"37.463000,139.617733",
third4:"37.459354,139.613583",
thirdPark:"37.461920,139.612800",
arches:"37.473279,139.648426",
hotel:"宮下温泉 栄光舘",
mist1:"37.462371,139.595143",
mist2:"37.464639,139.588639",
mistNorth:"早戸温泉 つるの湯",
fourth1:"37.481640,139.560030",
fourth2:"37.481690,139.554565",
park:"水沼公園 福島県金山町",
oshi:"37.457740,139.531530",
fifth:"37.448361,139.511972",
cliff:"塔のへつり 木かげの駐車場",
station:"会津若松駅"
};

// 只在真正拍攝景點的卡片顯示照片
const photoRules=[
[/^第一橋 C／D 經典俯瞰角度$/,"bridge1_CD.png"],
[/^第一橋 C／D$/,"bridge1_CD.png"],
[/^第一橋平面角度$/,"bridge1_flat.jpg.png"],
[/^第三橋拍攝點 1：/,"bridge3_point1.png"],
[/^第三橋拍攝點 4：/,"bridge3_point4.png"],
[/^第四橋點 1：/,"bridge4_point1.png"],
[/^第四橋點 2：/,"bridge4_point2.png"],
[/^大志集落點 1/,"oshi_point1.png"],
[/^第五只見川橋梁/,"bridge5.png"],
[/^塔崖（塔のへつり）$/,"to_no_hetsuri.png"]
];

const photoFor=name=>{
const found=photoRules.find(r=>r[0].test(name));
return found?"photos/"+found[1]:null;
};

// 霧幻峽：河上方首選、河下方備選
const mistNav=origin=>[
["河上方｜首選",drive(origin,M.mistNorth)],
["河下方｜備選（注意封路）",drive(origin,M.mist1)]
];

const mistReminder=
"導航提醒：兩條路線都請手動確認或調整目的地，避免導入橋面或封閉道路。從第一橋道之驛到早戶地區，正常參考車程約 12 分鐘／9 公里，不含停車與步行。若顯示約 25–30 分鐘、繞行山路或道路封閉，請重新確認，不要進入管制區。";

// 第四橋：車輛先至水沼公園，拍攝點另外查看
const parkNav=[
["水沼公園｜停車導航",loc(M.park)]
];

const D1=[
["11:00–11:20","第一橋 C／D 展望台停車場","抵達道之驛、停車、準備拍攝",[["道之驛停車場",loc(M.rest)]],""],
["11:20–11:50","步行至第一橋 C／D 展望台","登山、尋找最佳構圖",[["第一橋展望台",loc(M.view)]],""],
["11:50–13:10","第一橋 C／D 經典俯瞰角度","13:03 火車必拍，往會津若松方向。等待時可觀察河面風況。",[["第一橋展望台",loc(M.view)]],""],
["13:10–13:40","下山返回停車場","預留約 30 分鐘，不趕路。",[],""],
["13:40–14:05","開往第一橋平面角度","依風況、道路安全決定是否前往；山路小心駕駛。",[["開車路線",drive(M.rest,M.flat)]],""],
["14:05–14:35","第一橋平面角度","14:23 火車挑戰拍攝，往會津川口方向；亦可拍倒影。若道路不安全直接取消。",[["平面拍攝點",loc(M.flat)]],""],
["14:35–15:05","開往第三橋區域","預留約 30 分鐘，實際依導航。",[["前往第三橋點 1",drive(M.flat,M.third1)]],""],
["15:05–15:25","第三橋拍攝點 1：高清水隧道／雪棚","經典俯瞰角度空景。只有確認安全步行及停車空間才拍，不在車道停留。",[["拍攝點 1",loc(M.third1)]],""],
["15:25–15:50","第三橋拍攝點 4：國道 252 側","主要拍攝點，拍攝鐵橋側面。先導航停車位置，再步行至拍攝點。",[["先導航停車位置",loc(M.thirdPark)],["查看拍攝位置",loc(M.third4)]],""],
["15:50–16:15","宮下アーチ三兄弟","返回栄光舘途中順路短拍。光線不足可隔天早上從旅館步行拍攝。",[["三兄弟拍攝點",loc(M.arches)]],"397 198 366"],
["16:15–16:30","宮下温泉 栄光舘 Check-in","入住、停車、休息。",[["栄光舘導航",loc(M.hotel)]],""]
];

const D2A=[
["07:30–07:55","栄光舘 → 第一橋停車場","退房後出發，預留約 25 分鐘車程。",[["道之驛停車場",loc(M.rest)]],"397 200 896"],
["07:55–08:25","步行至第一橋 C／D 展望台","登山、找構圖。",[["第一橋展望台",loc(M.view)]],""],
["08:25–09:25","第一橋 C／D","09:01、09:20 火車補拍，兩個方向。",[["第一橋展望台",loc(M.view)]],""],
["09:25–10:05","下山、開往霧幻峽","含下山及開車。河上方首選、河下方備選；注意道路封閉。",mistNav(M.rest),"",mistReminder],
["10:05–10:20","霧幻峽點 1：橋上","河谷風景、隨緣拍霧。先確認橋面是否開放，以及合法安全的停車與步行空間。",[["查看橋上拍攝點",loc(M.mist1)]],""],
["10:20–10:45","霧幻峽點 2：河岸側（備案）","不同河谷視角。當天確認道路與時間，若需繞路或影響第四橋，直接跳過。",[["參考座標",loc(M.mist2)]],""],
["10:45–11:15","前往第四橋","預留約 30 分鐘移動。先至水沼公園停車，再步行至水沼橋。",parkNav,""],
["11:15–11:35","第四橋點 1：水沼橋遠眺","鐵橋、河谷全景。水沼公園停車後步行至橋上。",[["查看拍攝位置",loc(M.fourth1)]],""],
["11:35–11:55","第四橋點 2：側面倒影","鐵橋側面、河面倒影；注意站立空間。",[["拍攝點 2",loc(M.fourth2)]],""],
["11:55–12:15","前往大志集落","目標 12:15 前抵達並完成構圖。",[["開車路線",drive(M.fourth2,M.oshi)]],""],
["12:15–12:40","大志集落點 1","約 12:31 火車必拍！往會津若松方向。",[["大志集落拍攝點",loc(M.oshi)]],""],
["12:40–12:50","簡單午餐／休息","建議自備飯糰或三明治，不安排餐廳等候。",[["大志集落附近",loc(M.oshi)]],""],
["12:50–14:50","大志集落 → 塔崖","以 14:30–15:00 抵達為目標，實際依導航；不為趕時間超速。",[["開車路線",drive(M.oshi,M.cliff)]],""],
["14:50–15:35","塔崖（塔のへつり）","奇岩、吊橋、河谷；爭取日落前較好的自然光。",[["木かげ停車場",loc(M.cliff)]],"433 378 503*37"],
["15:35–16:45","塔崖 → 會津若松站","預留約 70 分鐘車程。",[["開車路線",drive(M.cliff,M.station)]],""],
["16:45–17:15","加油、還車","預留約 30 分鐘緩衝。",[["會津若松站租車據點",loc("会津若松駅 レンタカー")]],""]
];

const D2B=[
["08:00–08:25","栄光舘 → 霧幻峽","早餐、退房後出發。河上方首選、河下方備選；注意道路封閉。",mistNav(M.hotel),"","導航提醒：請手動確認目的地及道路。約 12 分鐘／9 公里是從第一橋道之驛至早戶地區的參考值，並非從栄光舘出發的保證車程。若導航繞遠或顯示封路，請重新確認，不進入管制區。"],
["08:25–08:40","霧幻峽點 1：橋上","河谷、只見川、晨霧。先確認橋面是否開放，以及安全停車與步行空間。",[["查看橋上拍攝點",loc(M.mist1)]],""],
["08:40–09:00","霧幻峽點 2：河岸側（備案）","不同河谷視角。只有道路安全可達且不影響第四橋火車時才拍。",[["參考座標",loc(M.mist2)]],""],
["09:00–09:20","前往第四橋點 1","優先爭取 09:10 前抵達水沼公園停車、步行準備；09:20 為原行程時間上限。",parkNav,""],
["09:20–09:40","第四橋點 1：水沼橋遠眺","約 09:32 火車拍攝！下行往會津川口，兼拍鐵橋及河谷。先於水沼公園停車，再步行到橋上。",[["查看拍攝位置",loc(M.fourth1)]],""],
["09:40–10:05","第四橋點 2：側面倒影","鐵橋側面、河面倒影；注意站立空間。",[["拍攝點 2",loc(M.fourth2)]],""],
["10:05–10:40","前往大志集落","預留車程與停車緩衝。",[["開車路線",drive(M.fourth2,M.oshi)]],""],
["10:40–11:45","大志集落周邊自由拍攝、休息","不增加遠距離景點；可先觀察構圖及拍河谷空景。",[["大志集落點 1",loc(M.oshi)]],""],
["11:45–12:10","簡單午餐","建議自備飯糰、三明治或便當，避免餐廳等候。",[],""],
["12:10–12:40","大志集落點 1：かねやまふれあい広場","約 12:31 火車必拍！往會津若松方向，提前完成構圖。",[["大志集落拍攝點",loc(M.oshi)]],""],
["12:40–13:15","第五只見川橋梁（選拍）","拍橋梁及山谷空景；若影響塔崖抵達時間就取消。",[["第五橋拍攝點",loc(M.fifth)]],""],
["13:15–15:00","第五橋 → 塔崖","長距離移動，15:00 前抵達為目標；實際依導航。",[["開車路線",drive(M.fifth,M.cliff)]],""],
["15:00–15:45","塔崖（塔のへつり）","奇岩、吊橋、河谷；下午山谷可能已有陰影。",[["木かげ停車場",loc(M.cliff)]],"433 378 503*37"],
["15:45–16:55","塔崖 → 會津若松站","預留約 70 分鐘車程。",[["開車路線",drive(M.cliff,M.station)]],""],
["16:55–17:25","加油、還車","預留 30 分鐘緩衝。",[["會津若松站租車據點",loc("会津若松駅 レンタカー")]],""]
];

const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

const red=s=>esc(s).replace(
/13:03|14:23|09:01|09:20|09:32|12:31/g,
x=>'<span class="train-time">'+x+'</span>'
);

function render(id,title,subtitle,rows){
document.getElementById(id).innerHTML=
'<div class="intro"><h2>'+title+'</h2><p>'+red(subtitle)+'</p></div>'+
rows.map(r=>{
const [time,name,desc,nav,code,reminder]=r;
const photo=photoFor(name);
const isTrain=/火車|列車/.test(desc);
const optional=name.includes("備案")||name.includes("選拍");

return '<article class="card '+(photo?'has-photo':'')+'">'+
(photo?'<button class="photo-thumb" type="button" data-photo="'+esc(photo)+'" aria-label="放大查看 '+esc(name)+'"><img loading="lazy" src="'+esc(photo)+'" alt="'+esc(name)+' 攝影參考"></button>':'')+
'<div class="top"><span class="time">'+esc(time)+'</span>'+
(isTrain?'<span class="tag train">🚆 火車重點</span>':optional?'<span class="tag optional">彈性選拍</span>':'')+'</div>'+
'<div class="name">'+esc(name)+'</div>'+
'<div class="desc">'+red(desc)+'</div>'+
'<div class="actions">'+nav.map(n=>'<a target="_blank" rel="noopener" href="'+esc(n[1])+'">📍 '+esc(n[0])+'</a>').join('')+'</div>'+
(code?'<div class="code">Mapcode：<strong>'+esc(code)+'</strong><button class="copy" data-code="'+esc(code)+'">複製</button></div>':'')+
(reminder?'<div class="nav-warning"><strong>⚠ 導航提醒</strong><div>'+esc(reminder)+'</div></div>':'')+
'</article>';
}).join('')+
'<div class="note">提醒：列車時間為行程參考，請以 JR 當日運行資訊為準。道路、停車、步行及光線條件須現場確認，不進入封閉路段。</div>';
}

render("day1","Day 1｜11/13（五）","第一橋 13:03 → 平面角度 14:23 → 第三橋 → 宮下三兄弟 → 栄光舘",D1);
render("day2a","Day 2｜需要補拍第一橋","09:01／09:20 第一橋 → 霧幻峽 → 第四橋 → 12:31 大志集落 → 塔崖",D2A);
render("day2b","Day 2｜不需補拍第一橋","霧幻峽 → 09:32 第四橋 → 12:31 大志集落 → 第五橋（選拍）→ 塔崖",D2B);

// 頁籤切換
document.querySelectorAll("[data-tab]").forEach(b=>{
b.addEventListener("click",()=>{
document.querySelectorAll("[data-tab]").forEach(x=>
x.classList.toggle("active",x===b));
document.querySelectorAll("main section").forEach(s=>
s.classList.toggle("hidden",s.id!==b.dataset.tab));
window.scrollTo({top:0,behavior:"instant"});
});
});

// Mapcode 複製
document.addEventListener("click",async e=>{
const b=e.target.closest("[data-code]");
if(!b)return;
try{
await navigator.clipboard.writeText(b.dataset.code);
b.textContent="已複製 ✓";
setTimeout(()=>b.textContent="複製",1500);
}catch(err){
prompt("請複製 Mapcode",b.dataset.code);
}
});

// 照片點擊放大
document.addEventListener("click",e=>{
const t=e.target.closest("[data-photo]");
if(t){
document.getElementById("lightbox-image").src=t.dataset.photo;
document.getElementById("lightbox").classList.add("open");
document.body.style.overflow="hidden";
}else if(e.target.closest(".lightbox-close")||e.target.id==="lightbox"){
document.getElementById("lightbox").classList.remove("open");
document.body.style.overflow="";
}
});

document.addEventListener("keydown",e=>{
if(e.key==="Escape"){
document.getElementById("lightbox").classList.remove("open");
document.body.style.overflow="";
}
});
</script>
